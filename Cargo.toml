[package]
name = "chat_realtime"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-ws = "0.3"

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "mysql",
    "macros"
] }

futures-util = "0.3"

dotenv = "0.15"



